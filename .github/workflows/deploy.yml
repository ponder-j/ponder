name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          # 用 Node 24（自带 npm 11）：npm 10 有可选依赖安装 bug（npm/cli#4828），
          # 会导致 rolldown 等原生绑定装不上，构建失败。
          node-version: 24
          cache: npm

      - name: Install dependencies
        # 使用 npm install 而不是 npm ci：
        # 本地 npm 生成的 lockfile 偶尔会漏掉其他平台的可选依赖（如 sharp 的 @emnapi 包），
        # npm install 会在 CI 机器上自动补齐，避免部署失败。
        run: npm install --no-audit --no-fund

      - name: Build site
        run: npm run build

      # 防止 GitHub Pages 用 Jekyll 处理以 _ 开头的目录（如 _astro）
      - name: Add .nojekyll
        run: touch dist/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
